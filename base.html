<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe66d">
  <title>{% block title %}یابنده{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='overrides.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('browse') }}"><b>ی</b> یابنده</a>
    <nav aria-label="ناوبری اصلی">
      {% if user %}
        <a href="{{ url_for('new_item') }}">ثبت وسیله +</a>
        <a href="{{ url_for('my_items') }}">آگهی‌های من</a>
        <form class="logout-form" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="nav-button" type="submit">خروج</button>
        </form>
      {% else %}
        <a class="eng" href="{{ url_for('signup') }}">SIGN UP</a>
        <a class="eng" href="{{ url_for('login') }}">LOG IN</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>یابنده · کنار هم، پیدا می‌کنیم.</footer>
</body>
</html>
